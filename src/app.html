<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Organization",
				"name": "Shoemate",
				"url": "https://shoemate.pages.dev/",
				"logo": "https://shoemate.pages.dev/images/logo-mark.svg",
				"description": "Premium sneakers with fast delivery and exclusive offers. Demo storefront — prices in USD."
			}
		</script>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebSite",
				"name": "Shoemate",
				"url": "https://shoemate.pages.dev/",
				"potentialAction": {
					"@type": "SearchAction",
					"target": "https://shoemate.pages.dev/search/?q={search_term_string}",
					"query-input": "required name=search_term_string"
				}
			}
		</script>
		<noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
