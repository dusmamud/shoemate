<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="description" content="Shoemate — premium sneakers with fast delivery and exclusive offers." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Shoemate" />
		<meta property="og:title" content="Shoemate — Premium Sneakers, Fast Delivery" />
		<meta
			property="og:description"
			content="Shop the latest premium sneakers with fast delivery and exclusive offers. New arrivals, bestsellers and limited drops — only at Shoemate."
		/>
		<meta property="og:url" content="https://shoemate.pages.dev/" />
		<meta property="og:image" content="https://shoemate.pages.dev/images/hero-sneaker.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Shoemate — Premium Sneakers, Fast Delivery" />
		<meta
			name="twitter:description"
			content="Shop the latest premium sneakers with fast delivery and exclusive offers. New arrivals, bestsellers and limited drops — only at Shoemate."
		/>
		<meta name="twitter:image" content="https://shoemate.pages.dev/images/hero-sneaker.png" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Organization",
				"name": "Shoemate",
				"url": "https://shoemate.pages.dev/",
				"logo": "https://shoemate.pages.dev/images/hero-sneaker.png",
				"description": "Premium sneakers with fast delivery and exclusive offers. Demo storefront — prices in USD."
			}
		</script>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebSite",
				"name": "Shoemate",
				"url": "https://shoemate.pages.dev/",
				"potentialAction": {
					"@type": "SearchAction",
					"target": "https://shoemate.pages.dev/search/?q={search_term_string}",
					"query-input": "required name=search_term_string"
				}
			}
		</script>
		<noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
